name: Build APK

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'release/**', '**.md' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then
            export ANDROID_HOME="$HOME/android-sdk"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)
          if [ -z "$SDKM" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/clt.zip -d /tmp/clt
            mv /tmp/clt/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
            SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/ReKab-by-firdaus.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ReKab-by-firdaus
          path: out/ReKab-by-firdaus.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ReKab by firdaus — build ${{ github.run_number }}
          body: Automatic build from ${{ github.sha }}. Install on the Omoda E5 head unit with adb (see README).
          files: out/ReKab-by-firdaus.apk
          make_latest: true

      - name: Save APK into the repo (release/)
        run: |
          mkdir -p release
          cp out/ReKab-by-firdaus.apk release/ReKab-by-firdaus.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/ReKab-by-firdaus.apk
          git commit -m "APK build ${{ github.run_number }} [skip ci]" || echo "no change"
          git push
